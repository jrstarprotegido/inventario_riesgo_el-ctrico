<!-- Snippet para capturar/previsualizar y subir foto
Instrucciones:
1) Pega la parte HTML dentro de tu .file-capture-wrapper en index.html
2) Añade la referencia al script o pega el script justo antes de </body>

Dentro de .file-capture-wrapper (reemplaza/añade donde esté el texto actual):

<input type="file" id="photo-input" accept="image/*" capture="environment" style="display:none" />

<!-- Botón opcional para subir (puedes colocarlo donde quieras) -->
<div style="margin-top:12px;">
  <button type="button" class="btn btn-primary" id="btn-upload" style="display:none">Subir foto</button>
</div>

<!-- Ya tienes este img en el HTML: -->
<img id="photo-preview" alt="Previsualización" />

---

Script (pegar antes de </body> o en un archivo .js incluido):

<script>
document.addEventListener('DOMContentLoaded', () => {
  const wrapper = document.querySelector('.file-capture-wrapper');
  const input = document.getElementById('photo-input');
  const preview = document.getElementById('photo-preview');
  const btnUpload = document.getElementById('btn-upload');

  // Abrir selector/cámara al pulsar el recuadro
  if (wrapper && input) {
    wrapper.addEventListener('click', (e) => {
      // Evitar que otros botones dentro del wrapper reinicien la acción
      if (e.target && ['BUTTON','A','INPUT','LABEL'].includes(e.target.tagName)) return;
      input.click();
    });
  }

  // Procesar selección y mostrar previsualización
  input.addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;

    if (!file.type.startsWith('image/')) {
      alert('Por favor selecciona una imagen.');
      return;
    }

    // Previsualizar usando URL.createObjectURL (eficiente)
    preview.src = URL.createObjectURL(file);
    preview.style.display = 'block';

    // Liberar memoria cuando cargue
    preview.onload = () => URL.revokeObjectURL(preview.src);

    // Mostrar botón de subir si existe
    if (btnUpload) btnUpload.style.display = 'inline-block';

    // Guardar archivo seleccionado globalmente para subirlo
    window._selectedPhoto = file;
  });

  // Subir la foto al servidor (endpoint ejemplo: /api/upload-photo)
  if (btnUpload) {
    btnUpload.addEventListener('click', async () => {
      const file = window._selectedPhoto;
      if (!file) {
        alert('No hay foto seleccionada.');
        return;
      }

      const form = new FormData();
      form.append('photo', file, file.name);

      try {
        // Ajusta la URL a tu backend real
        const res = await fetch('/api/upload-photo', {
          method: 'POST',
          body: form
        });

        if (res.ok) {
          alert('Foto subida correctamente.');
        } else {
          const text = await res.text();
          alert('Error al subir: ' + res.status + ' — ' + text);
        }
      } catch (err) {
        alert('Error de red: ' + err.message);
      }
    });
  }
});
</script>
